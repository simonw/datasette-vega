<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="https://latest.datasette.io/-/static/app.css">
    <link rel="stylesheet" href="/build/index.css">
    <script src="/build/index.js"></script>
    <title>Datasette Vega</title>
  </head>
  <body class="datasette-vega-demo">
    <h1>Datasette Vega</h1>
    <p>Enter the URL of the JSON version of any Datasette table:</p>
    <form action="." method="GET" style="margin-bottom: 2em">
      <input id="jsonUrl" type="text" name="url" value="https://datasette.io/global-power-plants/global-power-plants.json?_size=1000" style="width: 80%; font-size: 1.2em;">
      <input type="submit" value="Load" style="font-size: 1.2em; border: 1px solid #ccc">
      <p>Examples: <a href="/?url=https%3A%2F%2Fdatasette.io%2Fglobal-power-plants%2Fglobal-power-plants.json%3F_size%3D1000#g.mark=circle&g.x_column=longitude&g.x_type=quantitative&g.y_column=latitude&g.y_type=quantitative&g.color_column=primary_fuel">longitude/latitude/primary_fuel</a></p>
    </form>
    <div id="vis-tool"></div>
    <div id="vis-wrapper" style="overflow: auto">
      <div id="vis"></div>
    </div>
  </body>
</html>
